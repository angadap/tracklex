# Optional: applies new database migrations after YOU approve the run. Does nothing unless the secret SUPABASE_DB_URL exists.
# The sign-in function and migrations are otherwise applied by Claude directly. No Supabase account token is stored anywhere.
# Set it up: GitHub repo, Settings, Environments, New environment "production", tick Required reviewers and add yourself;
# then add SUPABASE_DB_URL as a secret of that environment (not a repository secret).
name: Apply database migrations
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply new database migrations
        if: env.SUPABASE_DB_URL != ''
        run: ./scripts/apply_migrations.sh
      - name: Skipped
        if: env.SUPABASE_DB_URL == ''
        run: echo "SUPABASE_DB_URL is not set, nothing to do."
